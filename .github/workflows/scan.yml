name: scan

# Rebuild the inventory and the plan. The control panel is only worth anything if it
# is TRUE, so this runs daily and commits the fresh data - the page reads it, so it
# can never drift from what the workflows actually are.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - tools/**
      - docs/index.html

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: The tools' own tests, first
        run: |
          # EVERY tool that ships a self-test runs here. Six of these were never executed
          # in CI - including wf_check.py, the validator that catches the class of bug that
          # made forge/backup.yml fail 40 consecutive runs at startup with no log. Their
          # tests existed, passed, and proved nothing, because nothing ran them.
          # 59 assertions in total. A test that never runs is a comment.
          for t in scan plan gaps interactions migrate simulate sweep wf_check; do
            echo "--- $t"
            python3 "tools/$t.py" --self-test
          done
      - name: Fetch every workflow in every repo
        env:
          GITHUB_TOKEN: "${{ secrets.FANOUT_TOKEN || github.token }}"
        run: python3 tools/fetch.py --out tree
      - name: Inventory it
        run: python3 tools/scan.py --dir tree --out docs/inventory.json
      - name: Plan it
        run: python3 tools/plan.py --inventory docs/inventory.json --out docs/plan.json
      # F-12: gaps.json, interactions.json and routes.json had NO producer in CI - they
      # were hand-run, and gaps.json was computed from a different inventory than the one
      # committed beside it (109 no-timeout gaps against 98 workflows: impossible). They
      # are now rebuilt from the same inventory, every run.
      - name: What is missing
        run: python3 tools/gaps.py --inventory docs/inventory.json --out docs/gaps.json
      - name: What calls what
        run: python3 tools/interactions.py --inventory docs/inventory.json --out docs/interactions.json
      - name: The routes
        run: python3 tools/simulate.py --inventory docs/inventory.json --gaps docs/gaps.json --out docs/routes.json
      - name: Commit the fresh inventory
        run: |
          # F-97: the verdict is "did the inventory land", not "did git exit 0".
          #
          # This step had its own four-attempt rebase-and-push loop, written because a
          # bare `git push` loses the race. The loop was right and the verdict was still
          # wrong - a push that exited 0 was never checked against the branch.
          # tools/commit-and-verify.sh does both: the same backoff, then a blob-sha
          # comparison against origin/main.
          bash tools/commit-and-verify.sh "chore: rescan every workflow [skip ci]" main -- \
            docs/inventory.json docs/plan.json docs/gaps.json docs/interactions.json docs/routes.json

  # Pages is set to build_type=workflow, so a workflow has to do the deploy. Without
  # this the panel is enabled but never published - which is exactly the kind of
  # half-connected state this repo exists to catch.
  pages:
    runs-on: ubuntu-latest
    needs: [scan]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # was @v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # was @v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # was @v4
