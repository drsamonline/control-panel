name: scan

# Rebuild the inventory and the plan. The control panel is only worth anything if it
# is TRUE, so this runs daily and commits the fresh data - the page reads it, so it
# can never drift from what the workflows actually are.

on:
  schedule:
    - cron: "40 8 * * 2"   # weekly, Tuesday 06:00 UTC
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - tools/**
      - docs/index.html
      # A change to the scanner's own definition should run the scanner. Without this
      # a fix to this file sat unexercised until the next tools/ change.
      - .github/workflows/scan.yml

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: The tools' own tests, first
        run: |
          # EVERY tool that ships a self-test runs here. Six of these were never executed
          # in CI - including wf_check.py, the validator that catches the class of bug that
          # made forge/backup.yml fail 40 consecutive runs at startup with no log. Their
          # tests existed, passed, and proved nothing, because nothing ran them.
          # 59 assertions in total. A test that never runs is a comment.
          # fetch.py joins the list because it now carries the guard that decides whether
          # the scan covers the estate or only the public part of it.
          for t in fetch scan plan gaps interactions migrate simulate sweep wf_check; do
            echo "--- $t"
            python3 "tools/$t.py" --self-test
          done
          # The commit step is the one that can fail AFTER the work succeeded, and it
          # was the only tool here with no test - which is why it went red three times
          # over a timestamp conflict nobody had looked for. The test builds the exact
          # race in a scratch repository: two runs of one generator, the second checked
          # out before the first committed.
          echo "--- commit-and-verify"
          bash tools/commit-and-verify.test.sh
      # A NARROW TOKEN MUST NOT PUBLISH A NARROWER ESTATE (2026-11-18).
      #
      # `secrets.FANOUT_TOKEN || github.token` looked defensive and did the opposite:
      # with the secret absent, github.token authenticated as THIS repository, fetch.py
      # fell back to the public list, and docs/inventory.json described a smaller estate
      # than exists - green, with `scope: public-only` recorded as a fact about the
      # estate. The same fallback cost the plan block 11 repositories, 8 products and 6
      # kits. So the secret is REQUIRED, the fallback is gone, and fetch.py runs in
      # CP_REQUIRE_FULL_SCOPE mode so a token that answers but cannot see the private
      # repositories refuses instead of returning the public list.
      - name: Require a cross-repository token
        env:
          TOK: ${{ secrets.FANOUT_TOKEN }}
        run: |
          if [ -z "$TOK" ]; then
            echo "::error::FANOUT_TOKEN is not set. Refusing to publish a public-only view of the estate as if it were the estate — set the secret, then re-run."
            exit 1
          fi
          echo "FANOUT_TOKEN present (${#TOK} chars, value not printed)"
      - name: Fetch every workflow in every repo
        env:
          GITHUB_TOKEN: "${{ secrets.FANOUT_TOKEN }}"
          CP_REQUIRE_FULL_SCOPE: "1"
        run: python3 tools/fetch.py --out tree
      - name: Inventory it
        run: python3 tools/scan.py --dir tree --out docs/inventory.json
      - name: Plan it
        run: python3 tools/plan.py --inventory docs/inventory.json --out docs/plan.json
      # F-12: gaps.json, interactions.json and routes.json had NO producer in CI - they
      # were hand-run, and gaps.json was computed from a different inventory than the one
      # committed beside it (109 no-timeout gaps against 98 workflows: impossible). They
      # are now rebuilt from the same inventory, every run.
      - name: What is missing
        run: python3 tools/gaps.py --inventory docs/inventory.json --out docs/gaps.json
      - name: What calls what
        run: python3 tools/interactions.py --inventory docs/inventory.json --out docs/interactions.json
      - name: The routes
        run: python3 tools/simulate.py --inventory docs/inventory.json --gaps docs/gaps.json --out docs/routes.json
      - name: Record the manifest for what this scan writes
        # The five generated files were committed without ever recording their own shas,
        # so the provenance gate saw a manifest that disagreed with the tree and refused
        # the commit - which is how a scan that succeeded reported failure. Every other
        # generator in the estate records before it commits; this one now does too, and
        # MANIFEST.json lands in the same commit as the files it describes.
        run: |
          python3 tools/manifest.py record \
            docs/inventory.json docs/plan.json docs/gaps.json \
            docs/interactions.json docs/routes.json \
            --producer "scan.yml@$(git rev-parse --short HEAD)"

      - name: Commit the fresh inventory
        run: |
          # F-97: the verdict is "did the inventory land", not "did git exit 0".
          #
          # This step had its own four-attempt rebase-and-push loop, written because a
          # bare `git push` loses the race. The loop was right and the verdict was still
          # wrong - a push that exited 0 was never checked against the branch.
          # tools/commit-and-verify.sh does both: the same backoff, then a blob-sha
          # comparison against origin/main.
          bash tools/commit-and-verify.sh "chore: rescan every workflow [skip ci]" main -- \
            docs/inventory.json docs/plan.json docs/gaps.json docs/interactions.json docs/routes.json MANIFEST.json

  # Pages is set to build_type=workflow, so a workflow has to do the deploy. Without
  # this the panel is enabled but never published - which is exactly the kind of
  # half-connected state this repo exists to catch.
  pages:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [scan]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
        with:
          fetch-depth: 1
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # was @v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # was @v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # was @v4
