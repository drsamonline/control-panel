name: scan

# Rebuild the inventory and the plan. The control panel is only worth anything if it
# is TRUE, so this runs daily and commits the fresh data - the page reads it, so it
# can never drift from what the workflows actually are.

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [ main ]
    paths:
      - tools/**
      - docs/index.html

permissions:
  contents: write

concurrency:
  group: scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # was @v5
        with:
          python-version: "3.12"
      - run: python -m pip install --quiet pyyaml
      - name: The tools' own tests, first
        run: |
          # EVERY tool that ships a self-test runs here. Six of these were never executed
          # in CI - including wf_check.py, the validator that catches the class of bug that
          # made forge/backup.yml fail 40 consecutive runs at startup with no log. Their
          # tests existed, passed, and proved nothing, because nothing ran them.
          # 59 assertions in total. A test that never runs is a comment.
          for t in scan plan gaps interactions migrate simulate sweep wf_check; do
            echo "--- $t"
            python3 "tools/$t.py" --self-test
          done
      - name: Fetch every workflow in every repo
        env:
          GITHUB_TOKEN: "${{ secrets.FANOUT_TOKEN || github.token }}"
        run: python3 tools/fetch.py --out tree
      - name: Inventory it
        run: python3 tools/scan.py --dir tree --out docs/inventory.json
      - name: Plan it
        run: python3 tools/plan.py --inventory docs/inventory.json --out docs/plan.json
      - name: Commit the fresh inventory
        run: |
          git config user.name  "forge-bot"
          git config user.email "bot@users.noreply.github.com"
          git add docs/inventory.json docs/plan.json
          if git diff --cached --quiet; then echo "unchanged"; else
            git commit -m "chore: rescan every workflow [skip ci]"
            # retry: a bare `git push` loses the race when anything else commits first
            BR="${GITHUB_REF_NAME:-main}"
            pushed=0
            for attempt in 1 2 3 4; do
              git fetch origin "$BR" --quiet
              git rebase "origin/$BR" --quiet || { git rebase --abort || true; sleep 4; continue; }
              if git push --quiet origin "HEAD:$BR"; then pushed=1; break; fi
              echo "::warning::push rejected on attempt $attempt - the branch moved again"
              sleep 4
            done
            [ "$pushed" = 1 ] || { echo "::error::could not push after 4 attempts - another workflow keeps moving the branch"; exit 1; }
          fi

  # Pages is set to build_type=workflow, so a workflow has to do the deploy. Without
  # this the panel is enabled but never published - which is exactly the kind of
  # half-connected state this repo exists to catch.
  pages:
    runs-on: ubuntu-latest
    needs: [scan]
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # was @v4
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # was @v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # was @v3
        with: { path: docs }
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # was @v4
